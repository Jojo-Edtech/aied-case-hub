# Add these directives to the default IP server block after Certbot issues the
# short-lived IP certificate. The API location remains in nginx-location.conf.
listen 443 ssl default_server;
listen [::]:443 ssl default_server;

ssl_certificate /etc/letsencrypt/live/47.106.124.32/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/47.106.124.32/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:AIEDCaseTLS:10m;
ssl_session_timeout 1d;
