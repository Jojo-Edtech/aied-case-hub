name: Daily Source Link Verification

on:
  schedule:
    # 22:05 UTC = 06:05 Hong Kong time.
    - cron: '5 22 * * *'
  workflow_dispatch:
    inputs:
      check_all:
        description: Check every source URL in this run
        required: false
        type: boolean
        default: false

concurrency:
  group: aied-data-writes
  cancel-in-progress: false

permissions: {}

jobs:
  verify-links:
    name: Verify original source links
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to commit verified links and regenerated pages.
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    env:
      TZ: Asia/Hong_Kong
      LINK_CHECK_LIMIT: '120'
      LINK_CHECK_CONCURRENCY: '6'
      LINK_CHECK_ALL: ${{ inputs.check_all || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source links
        run: npm run check:links

      - name: Sanitize public data
        run: npm run sanitize:public

      - name: Validate updated data
        run: npm run validate:data

      - name: Regenerate shareable detail pages
        run: npm run generate:pages

      - name: Commit verification results
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- data/cases.csv data/resources.csv data/prompts.csv data/reports/link-check-report.json cases/ resources/ prompts/ paths/ sitemap.xml; then
            echo "No link verification changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cases.csv data/resources.csv data/prompts.csv data/reports/link-check-report.json cases/ resources/ prompts/ paths/ sitemap.xml
          git commit -m "Verify AIED source links"
          gh auth setup-git
          git pull --rebase origin main
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish link report summary
        if: always()
        run: |
          if [ -f data/reports/link-check-report.json ]; then
            node -e 'const r=require("./data/reports/link-check-report.json"); console.log(`## Link verification\n\nChecked **${r.checked_urls}** of **${r.total_urls}** unique URLs.\n\n\`${JSON.stringify(r.counts)}\``)' >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    if: ${{ needs.verify-links.outputs.changed == 'true' }}
    needs: verify-links
    permissions:
      contents: read
      pages: write     # Required by the reusable GitHub Pages deployment workflow.
      id-token: write  # Required for GitHub Pages OIDC authentication.
    uses: ./.github/workflows/deploy-pages.yml
