name: Daily AIED Candidate Update

on:
  schedule:
    # 22:00 UTC = 06:00 Hong Kong time.
    - cron: '0 22 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/daily-candidate-update.yml'
      - 'scripts/collect-candidate-cases.mjs'
      - 'scripts/csv-utils.mjs'
      - 'scripts/data-quality.mjs'
      - 'scripts/generate-detail-pages.mjs'
      - 'scripts/validate-data.mjs'
      - 'data/source_feeds.json'
      - 'package.json'

permissions: {}

concurrency:
  group: aied-data-writes
  cancel-in-progress: false

jobs:
  collect-candidates:
    name: Collect candidate teaching cases
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    env:
      TZ: Asia/Hong_Kong
      SUMMARY_FILE: .tmp/candidate_update_summary.md
      MAX_NEW_CANDIDATES: '40'
      AUTO_PUBLISH_CASES: 'true'
      AUTO_PUBLISH_MIN_SCORE: ${{ vars.AUTO_PUBLISH_MIN_SCORE || '0' }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      FIRECRAWL_ENABLED: ${{ vars.FIRECRAWL_ENABLED || 'true' }}
      FIRECRAWL_PRIMARY: ${{ vars.FIRECRAWL_PRIMARY || 'true' }}
      FIRECRAWL_SEARCH_ENABLED: ${{ vars.FIRECRAWL_SEARCH_ENABLED || 'true' }}
      ARTICLE_ENRICHMENT_ENABLED: ${{ vars.ARTICLE_ENRICHMENT_ENABLED || 'true' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect candidate cases
        run: npm run update:candidates

      - name: Validate case data
        run: npm run validate:data

      - name: Generate shareable detail pages
        run: npm run generate:pages

      - name: Commit case data changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet -- data/cases.csv data/candidate_cases.csv cases/ resources/ prompts/ paths/ sitemap.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cases.csv data/candidate_cases.csv cases/ resources/ prompts/ paths/ sitemap.xml
          git commit -m "Add daily AIED cases"
          git pull --rebase origin main
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Report case update
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          {
            echo "## Case library updated"
            echo
            echo "New teaching-practice matches were published directly with quality and link-verification labels."
            echo
            if [ -f "$SUMMARY_FILE" ]; then
              cat "$SUMMARY_FILE"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report no case changes
        if: steps.changes.outputs.changed != 'true'
        run: |
          {
            echo "## Case library unchanged"
            echo
            if [ -f "$SUMMARY_FILE" ]; then
              cat "$SUMMARY_FILE"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: ${{ needs.collect-candidates.outputs.changed == 'true' }}
    needs: collect-candidates
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
