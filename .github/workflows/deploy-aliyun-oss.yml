name: Deploy Static Site to Aliyun OSS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-aliyun-oss.yml"
      - ".nojekyll"
      - "index.html"
      - "resources.html"
      - "cases/**"
      - "paths/**"
      - "prompts/**"
      - "resources/**"
      - "sitemap.xml"
      - "script.js"
      - "styles.css"
      - "data/cases.csv"
      - "data/prompts.csv"
      - "data/rag-config.json"
      - "data/resources.csv"
      - "data/learning_paths.json"
      - "data/reports/**"
      - "scripts/build-static-site.mjs"
      - "scripts/validate-data.mjs"
      - "scripts/csv-utils.mjs"
      - "scripts/data-quality.mjs"
      - "scripts/generate-detail-pages.mjs"
      - "package.json"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Aliyun OSS
    if: ${{ vars.ALIYUN_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate data
        run: npm run validate:data

      - name: Prepare static files
        run: npm run build:static

      - name: Install ossutil
        run: |
          set -euo pipefail
          version="2.4.0"
          archive="ossutil-${version}-linux-amd64.zip"
          archive_path="$RUNNER_TEMP/$archive"
          install_root="$RUNNER_TEMP/ossutil"
          bin_dir="$RUNNER_TEMP/bin"

          curl -fsSL --retry 3 \
            "https://gosspublic.alicdn.com/ossutil/v2/${version}/${archive}" \
            -o "$archive_path"
          echo "85edf66b2fb7238f5c7e25cab820cf29312319fe4935b7c86a6b8485eb434f3c  $archive_path" \
            | sha256sum --check --strict -
          unzip -q "$archive_path" -d "$install_root"
          mkdir -p "$bin_dir"
          install -m 0755 "$install_root/ossutil-${version}-linux-amd64/ossutil" "$bin_dir/ossutil"
          echo "$bin_dir" >> "$GITHUB_PATH"
          command -v ossutil

      - name: Upload static site
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_PREFIX: ${{ secrets.ALIYUN_OSS_PREFIX }}
          ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
        run: |
          set -euo pipefail
          required=(
            OSS_ACCESS_KEY_ID
            OSS_ACCESS_KEY_SECRET
            ALIYUN_OSS_BUCKET
            ALIYUN_OSS_ENDPOINT
          )

          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured in GitHub Secrets."
              exit 1
            fi
          done

          endpoint_host="${ALIYUN_OSS_ENDPOINT#*://}"
          endpoint_host="${endpoint_host%%/*}"
          region="${ALIYUN_OSS_REGION:-${endpoint_host#oss-}}"
          region="${region%%.aliyuncs.com}"
          region="${region%-internal}"
          target="oss://${ALIYUN_OSS_BUCKET}/"

          if [ -n "$ALIYUN_OSS_PREFIX" ]; then
            prefix="${ALIYUN_OSS_PREFIX#/}"
            prefix="${prefix%/}"
            target="oss://${ALIYUN_OSS_BUCKET}/${prefix}/"
          fi

          ossutil cp -r dist/ "$target" --update \
            --endpoint "$ALIYUN_OSS_ENDPOINT" \
            --region "$region"
          echo "Uploaded static site to $target"
